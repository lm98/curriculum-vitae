name: Build CV

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - name: Compile
        run: typst compile --font-path fonts --ignore-system-fonts --input theme=${{ vars.CV_THEME || 'modern' }} cv.typ Leonardo_Micelli_CV.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: Leonardo_Micelli_CV.pdf

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Leonardo_Micelli_CV.pdf
