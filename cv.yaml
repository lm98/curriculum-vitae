summary: >-
  Software engineer building distributed platforms at the intersection of
  systems engineering and machine learning. For the past two years I have led
  the development of an open-source Digital Twin ecosystem for healthcare —
  Kotlin microservices, a TypeScript frontend and containerised deployments —
  and co-designed its MLOps and federated learning layers, published in
  peer-reviewed venues. Previously built cloud ETL pipelines on Snowflake at
  Philip Morris International. Fluent in Kotlin, Rust, Python and TypeScript.

