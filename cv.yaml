summary: >-
  Software engineer building distributed platforms where systems engineering
  meets machine learning. I lead development of an open-source Digital Twin
  ecosystem for healthcare (Kotlin microservices, TypeScript, Docker) and
  co-designed its MLOps and federated learning layers, published in
  peer-reviewed venues. Previously built cloud ETL pipelines on Snowflake at
  Philip Morris International.

